apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms
spec:
  # Template source only after the controlled handover; Rollout owns the Pods.
  replicas: 0
  template:
    spec:
      containers:
      - name: csms
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef: {fieldPath: metadata.namespace}
