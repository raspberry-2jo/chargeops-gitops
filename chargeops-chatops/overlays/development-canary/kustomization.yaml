apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../development
- rollout.yaml
- services.yaml
- analysis.yaml
- monitoring.yaml
- probe-rbac.yaml
- ocpp-settings.yaml
patches:
- path: deployment-reference.yaml
- path: verifier-rbac.yaml
configMapGenerator:
- name: csms-dev-canary-probe
  files:
  - probe.py
  - probe_metrics.py
  - ocpp_probe.py
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: Deployment
    name: csms
    fieldPath: spec.template.spec.containers.[name=csms].image
  targets:
  - select:
      kind: AnalysisTemplate
      name: csms-dev-availability
    fieldPaths:
    - spec.metrics.[name=ocpp-websocket].provider.job.spec.template.spec.containers.[name=probe].image
images:
- name: registry.chargeops.lab:5000/chargeops/chargeops-csms
  newName: registry.chargeops.lab:5000/chargeops/chargeops-csms
  digest: sha256:effd4b85f310de620298a9935b1792c3d045cadd5a20f5a287012814fbe66ea1
