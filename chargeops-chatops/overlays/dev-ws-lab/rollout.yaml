apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: csms-ws-lab
  labels:
    chargeops.test/workload: csms-ws-lab
spec:
  replicas: 4
  revisionHistoryLimit: 3
  # Experiment 2 R2: retain the stabilization period; zero saved only about 4%.
  minReadySeconds: 30
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  rollbackWindow:
    revisions: 3
  selector:
    matchLabels:
      app: csms-ws-lab
  strategy:
    canary:
      # Experiment 2: surge 2 exceeds the measured lab quota; unavailable 1
      # conflicts with the enforced minimum of four available replicas.
      maxSurge: 1
      maxUnavailable: 0
      stableService: csms-ws-lab-stable
      canaryService: csms-ws-lab-canary
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: csms-ws-lab-availability
          args:
          - name: check-stable
            value: 'true'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: stage
            value: '25'
          - name: rollout-uid
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - setWeight: 50
      - analysis:
          templates:
          - templateName: csms-ws-lab-availability
          args:
          - name: check-stable
            value: 'true'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: stage
            value: '50'
          - name: rollout-uid
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - setWeight: 100
      - analysis:
          templates:
          - templateName: csms-ws-lab-availability
          args:
          - name: check-stable
            value: 'false'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: stage
            value: '100'
          - name: rollout-uid
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
  template:
    metadata:
      labels:
        app: csms-ws-lab
        chargeops.test/workload: csms-ws-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: csms
        image: registry.chargeops.lab:5000/chargeops/chargeops-csms:BUILD-WS-LAB-IMAGE-FIRST
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - csms.app:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        envFrom:
        - configMapRef:
            name: csms-ws-lab-config
        env:
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: chargeops-dev-secrets
              key: DB_DSN
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: chargeops-dev-secrets
              key: CSMS_API_TOKEN
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 8000
        - name: ocpp
          containerPort: 9000
        - name: metrics
          containerPort: 9100
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 256Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        # Exclude the untolerated control-plane node from spread calculations.
        nodeTaintsPolicy: Honor
        labelSelector: &id001
          matchLabels:
            app: csms-ws-lab
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector: *id001
