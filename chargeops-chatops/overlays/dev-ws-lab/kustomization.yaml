apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- rollout.yaml
- analysis.yaml
- services.yaml
- config.yaml
- settings.yaml
- evaluator.yaml
- load.yaml
configMapGenerator:
- name: csms-ws-lab-probe
  files:
  - ws_policy.py
  - ws_evaluator.py
- name: csms-ws-lab-load
  files:
  - load.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    chargeops.test/workload: csms-ws-lab
