apiVersion: v1
kind: ConfigMap
metadata:
  name: csms-ws-lab-settings
  labels:
    chargeops.test/workload: csms-ws-lab
data:
  GATE_ENABLED: 'true'
  GATE_BASELINE_AT: '0'
  GATE_THROUGHPUT_DROP_PERCENT: '50'
  GATE_PROMETHEUS_URL: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  WS_CONNECTION_DROP_PERCENT: '2'
  WS_THROUGHPUT_DROP_PERCENT: '15'
  WS_ERROR_PERCENT: '1'
  WS_UNEXPECTED_CLOSE_PERCENT: '1'
  WS_HEARTBEAT_SUCCESS_PERCENT: '99'
  # Experiments 1/2: retain 99/15 candidate limits; do not loosen to hide noise.
  # Heartbeat remains observe-only until its calculation is fixed and validated.
  # Query lag 30s / throughput window 120s are deferred until experiments 3/4.
  # Server Heartbeat false positive; throughput normal drop reached 22.9%.
  # Keep candidate limits visible, but do not use these two signals to block Dev.
  WS_HEARTBEAT_MODE: observe-only
  WS_THROUGHPUT_MODE: observe-only
  WS_MIN_OCPP_SAMPLES: '600'
  WS_MIN_HEARTBEAT_SAMPLES: '300'
  WS_MIN_SESSION_OPPORTUNITIES: '300'
  WS_INPUT_PROFILE_TOLERANCE_PERCENT: '10'
  WS_MAX_OBSERVATION_SECONDS: '600'
  WS_LOAD_PROFILE_CONFIRMED: 'false'
  WS_LOAD_PROFILE_ID: ''
  WS_OOM_MAX_SAMPLE_AGE_SECONDS: '45'
