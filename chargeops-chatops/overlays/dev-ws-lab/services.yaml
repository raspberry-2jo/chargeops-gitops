apiVersion: v1
kind: Service
metadata:
  name: csms-ws-lab
  namespace: dev
  labels:
    chargeops.test/workload: csms-ws-lab
spec:
  selector:
    app: csms-ws-lab
  ports:
  - name: http
    port: 8000
    targetPort: http
  - name: ocpp
    port: 9000
    targetPort: ocpp
  - name: metrics
    port: 9100
