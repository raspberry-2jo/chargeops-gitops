apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms
spec:
  replicas: 2
  # Shared Dev/Ops deployment contract; Dev remains a Deployment, not a Rollout.
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        chargeops.io/deployment-mode: rolling
    spec:
      containers:
      - name: csms
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
