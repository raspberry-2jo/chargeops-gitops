apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        chargeops.io/deployment-mode: rolling
    spec:
      containers:
      - name: csms
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
