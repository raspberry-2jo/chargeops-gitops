apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: csms
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 20
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  rollbackWindow:
    revisions: 3
  selector:
    matchLabels:
      app: csms
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csms
    # Deployment stays at zero after the verified bootstrap handover.
    # Never revive its candidate image when an analysis fails.
    scaleDown: never
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      stableService: csms-stable
      canaryService: csms-canary
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: csms-availability
            args:
              - name: check-stable
                value: "true"
        - setWeight: 50
        - analysis:
            templates:
              - templateName: csms-availability
            args:
              - name: check-stable
                value: "true"
        - setWeight: 100
        - analysis:
            templates:
              - templateName: csms-availability
            args:
              - name: check-stable
                value: "false"
