apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: csms
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 20
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  rollbackWindow:
    revisions: 3
  selector:
    matchLabels:
      app: csms
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csms
    scaleDown: never
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      stableService: csms-stable
      canaryService: csms-canary
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: csms-availability
          args:
          - name: check-stable
            value: 'true'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 50
      - analysis:
          templates:
          - templateName: csms-availability
          args:
          - name: check-stable
            value: 'true'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 100
      - analysis:
          templates:
          - templateName: csms-availability
          args:
          - name: check-stable
            value: 'false'
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
