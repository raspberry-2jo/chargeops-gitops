apiVersion: v1
kind: ServiceAccount
metadata:
  name: csms-ops-service-gate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csms-ops-service-gate
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csms-ops-service-gate
subjects:
- kind: ServiceAccount
  name: csms-ops-service-gate
  namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csms-ops-service-gate
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csms-ops-service-gate-egress
spec:
  podSelector:
    matchLabels:
      chargeops.io/role: canary-probe
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
    ports:
    - port: 8000
      protocol: TCP
    - protocol: TCP
      port: 9000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 10.10.30.11/32
    - ipBlock:
        cidr: 10.10.30.12/32
    ports:
    - protocol: TCP
      port: 6432
    - protocol: TCP
      port: 5432
