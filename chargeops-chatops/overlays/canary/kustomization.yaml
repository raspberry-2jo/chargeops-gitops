apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops
resources:
- ../prod
- rollout.yaml
- services.yaml
- analysis.yaml
- networkpolicy.yaml
- probe-monitoring.yaml
- gate-rbac.yaml
- ocpp-settings.yaml
configMapGenerator:
- name: csms-canary-probe
  files:
  - probe.py
  - probe_metrics.py
  - service_gates.py
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  disableNameSuffixHash: true
replacements:
- source:
    kind: Deployment
    name: csms
    fieldPath: spec.template.spec.containers.[name=csms].image
  targets:
  - select:
      kind: AnalysisTemplate
      name: csms-availability
    fieldPaths:
    - spec.metrics.[name=websocket-ocpp-smoke].provider.job.spec.template.spec.containers.[name=probe].image
