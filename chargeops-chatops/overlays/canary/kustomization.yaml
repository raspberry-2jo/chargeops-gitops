apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops
resources:
  - ../prod
  - rollout.yaml
  - services.yaml
  - analysis.yaml
  - networkpolicy.yaml
  - probe-monitoring.yaml
  - gate-rbac.yaml
configMapGenerator:
  - name: csms-canary-probe
    files:
      - probe.py
      - probe_metrics.py
      - service_gates.py
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  disableNameSuffixHash: true
