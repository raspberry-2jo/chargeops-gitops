apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: csms
          command: [python, -m, uvicorn, 'csms.app:app', --host, 0.0.0.0, --port, '8000']
          envFrom:
            - configMapRef:
                name: chargeops-dev-config
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef: {name: chargeops-dev-secrets, key: DB_DSN}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: chargeops-dev-secrets, key: CSMS_API_TOKEN}
            - {name: REQUIRE_CN, $patch: delete}
            - {name: HEARTBEAT_INTERVAL, $patch: delete}
            - {name: OCPP_PORT, $patch: delete}
            - {name: METRICS_PORT, $patch: delete}
            - {name: DB_POOL, $patch: delete}
            - {name: PEERS_DNS, $patch: delete}
            - {name: DRAIN_SECONDS, $patch: delete}
          livenessProbe:
            httpGet: {path: /livez, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
