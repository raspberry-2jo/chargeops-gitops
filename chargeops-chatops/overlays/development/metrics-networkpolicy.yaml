apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csms-prometheus-ingress
spec:
  podSelector:
    matchLabels:
      app: csms
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
