apiVersion: v1
kind: ConfigMap
metadata:
  name: chargeops-dev-config
data:
  ENVIRONMENT: dev
  CSMS_URL: http://csms.dev.svc.cluster.local:8000
  REQUIRE_CN: 'false'
  HEARTBEAT_INTERVAL: '30'
  OCPP_PORT: '9000'
  METRICS_PORT: '9100'
  DB_POOL: '2'
  PEERS_DNS: csms-pods.dev.svc.cluster.local
  DRAIN_SECONDS: '20'
  # A dedicated existing virtual/model charger in the DEV database.
  TEST_CHARGER_ID: CI-DEV-CHARGER-001
