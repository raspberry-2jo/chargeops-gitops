apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: development-boundary
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Per user instruction, DEV retains the existing DB settings.
    # Namespaces do not isolate data in this shared database.
    - to:
        - ipBlock: {cidr: 10.10.30.11/32}
        - ipBlock: {cidr: 10.10.30.12/32}
      ports:
        - {protocol: TCP, port: 6432}
        - {protocol: TCP, port: 5432}
