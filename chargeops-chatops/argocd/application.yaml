apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chargeops-chatops-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raspberry-2jo/chargeops-gitops.git
    targetRevision: main
    path: chargeops-chatops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
