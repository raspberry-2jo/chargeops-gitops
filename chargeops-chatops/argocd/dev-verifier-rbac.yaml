apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-dev-application-reader
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [chargeops-dev]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-dev-application-reader
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: jenkins-dev-verifier
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-dev-application-reader
