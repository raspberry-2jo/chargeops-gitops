apiVersion: v1
kind: ServiceAccount
metadata:
  name: csms-canary-probe
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csms-canary-probe
  namespace: ops
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csms-canary-probe
  namespace: ops
subjects:
  - kind: ServiceAccount
    name: csms-canary-probe
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csms-canary-probe
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-canary
  namespace: ops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-canary
  namespace: ops
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, pods/log, services]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts, analysisruns]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts/status]
    resourceNames: [csms]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-canary
  namespace: ops
subjects:
  - kind: ServiceAccount
    name: jenkins-canary
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-canary
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [chargeops-chatops-dev]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-canary
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: jenkins-canary
    namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-canary
