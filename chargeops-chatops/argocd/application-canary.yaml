apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Same owner as the existing ops application. Do not create a second owner.
  name: chargeops-chatops-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raspberry-2jo/chargeops-gitops.git
    targetRevision: main
    path: chargeops-chatops/overlays/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  ignoreDifferences:
    - group: ""
      kind: Service
      name: csms-stable
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - group: ""
      kind: Service
      name: csms-canary
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
