apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chargeops-image-updater
  namespace: argocd
  annotations:
    gitops-verification: bootstrap-test-2
spec:
  writeBackConfig:
    method: git:secret:chargeops-git-write
    gitConfig:
      repository: https://github.com/raspberry-2jo/chargeops-gitops.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
  - namePattern: chargeops-chatops-dev
    images:
    - alias: chatops-bot
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-chatops-bot:dev
      commonUpdateSettings:
        updateStrategy: digest
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-chatops-bot
    - alias: chargeops-ai-gateway
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-ai-gateway:dev
      commonUpdateSettings:
        updateStrategy: digest
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-ai-gateway
    - alias: csms
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-csms:dev
      commonUpdateSettings:
        updateStrategy: digest
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-csms
    - alias: notifier
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-notifier:dev
      commonUpdateSettings:
        updateStrategy: digest
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-notifier
    - alias: vcharger
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-vcharger:dev
      commonUpdateSettings:
        updateStrategy: digest
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-vcharger
    - alias: collector
      imageName: registry.chargeops.lab:5000/chargeops/chargeops-collector:dev
      commonUpdateSettings:
        updateStrategy: digest
        forceUpdate: true
      manifestTargets:
        kustomize:
          name: registry.chargeops.lab:5000/chargeops/chargeops-collector
