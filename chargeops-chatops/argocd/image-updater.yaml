apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chargeops-image-updater
  namespace: argocd
  annotations:
    gitops-verification: "bootstrap-test-1"
spec:
  writeBackConfig:
    method: git:secret:chargeops-git-write
    gitConfig:
      repository: https://github.com/raspberry-2jo/chargeops-gitops.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: chargeops-chatops-dev
      images:
        - alias: bot
          imageName: docker.io/chanjookim/chargeops-chatops-bot:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-chatops-bot
        - alias: router
          imageName: docker.io/chanjookim/chargeops-alert-router:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-alert-router
        - alias: csms
          imageName: docker.io/chanjookim/chargeops-mock-csms:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-mock-csms
        - alias: chargeops-ai-gateway
          imageName: docker.io/chanjookim/chargeops-ai-gateway:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-ai-gateway
        - alias: chatops-bot-v2
          imageName: docker.io/chanjookim/chargeops-v2-chatops-bot:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-v2-chatops-bot
        - alias: csms-v2
          imageName: docker.io/chanjookim/chargeops-v2-csms:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-v2-csms
        - alias: notifier-v2
          imageName: docker.io/chanjookim/chargeops-v2-notifier:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-v2-notifier
        - alias: vcharger-v2
          imageName: docker.io/chanjookim/chargeops-v2-vcharger:dev
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-v2-vcharger
        - alias: collector-v2
          imageName: docker.io/chanjookim/chargeops-v2-collector:dev
          commonUpdateSettings:
            updateStrategy: digest
            forceUpdate: true
          manifestTargets:
            kustomize:
              name: chanjookim/chargeops-v2-collector
