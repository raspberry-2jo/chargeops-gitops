apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcharger
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vcharger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vcharger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: vcharger
          image: registry.chargeops.lab:5000/chargeops/chargeops-vcharger:dev
          imagePullPolicy: Always
          args:
            - --url
            - ws://csms:9000/ocpp
            - --ids
            - CH-01
            - --ramp
            - '1'
            - --control-port
            - '8081'
          ports:
            - name: control
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
