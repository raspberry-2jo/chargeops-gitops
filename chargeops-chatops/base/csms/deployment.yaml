apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms
spec:
  replicas: 4
  selector:
    matchLabels:
      app: csms
  template:
    metadata:
      labels:
        app: csms
        app.kubernetes.io/name: csms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: csms
          image: registry.chargeops.lab:5000/chargeops/chargeops-csms:dev
          imagePullPolicy: Always
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: chargeops-secrets
                  key: DB_DSN
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chargeops-secrets
                  key: CSMS_API_TOKEN
            - name: REQUIRE_CN
              value: 'false'
            - name: HEARTBEAT_INTERVAL
              value: '30'
            - name: OCPP_PORT
              value: '9000'
            - name: METRICS_PORT
              value: '9100'
            - name: DB_POOL
              value: '20'
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PEERS_DNS
              value: csms-pods.ops.svc.cluster.local
            - name: DRAIN_SECONDS
              value: '20'
          ports:
            - name: http
              containerPort: 8000
            - name: ocpp
              containerPort: 9000
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
