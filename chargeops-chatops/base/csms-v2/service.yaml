apiVersion: v1
kind: Service
metadata:
  name: csms-v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: csms-v2
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: ocpp
      port: 9000
      targetPort: ocpp
    - name: metrics
      port: 9100
      targetPort: metrics
