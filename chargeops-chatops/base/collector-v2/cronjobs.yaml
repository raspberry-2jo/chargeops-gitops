apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector-v2-status
  labels:
    app.kubernetes.io/name: collector-v2
spec:
  schedule: '*/5 * * * *'
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: collector-v2
            app.kubernetes.io/mode: status
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: harbor-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          restartPolicy: Never
          containers:
            - name: collector
              image: chanjookim/chargeops-v2-collector:dev
              imagePullPolicy: IfNotPresent
              args:
                - status
              envFrom:
                - configMapRef:
                    name: collector-v2-config
                - secretRef:
                    name: chargeops-app-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: raw
                  mountPath: /data
          volumes:
            - name: raw
              persistentVolumeClaim:
                claimName: collector-v2-raw
  startingDeadlineSeconds: 120
---
