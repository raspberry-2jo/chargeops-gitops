apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-bot-v2
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chatops-bot-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-bot-v2
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: chatops-bot-v2
          image: chanjookim/chargeops-v2-chatops-bot:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: chargeops-app-secrets
          env:
            - name: CSMS_URL
              value: http://csms-v2:8000
            - name: AI_URL
              value: http://ai-gateway:8000
            - name: JENKINS_URL
              value: http://10.10.40.10:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    type: Recreate
