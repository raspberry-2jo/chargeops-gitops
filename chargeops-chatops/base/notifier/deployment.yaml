apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
        app.kubernetes.io/name: notifier
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: notifier
          image: registry.chargeops.lab:5000/chargeops/chargeops-notifier:dev
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: chargeops-secrets
          env:
            - name: ALERTMANAGER_URL
              value: http://kps-kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            - name: CSMS_URL
              value: http://csms:8000
            - name: AI_URL
              value: http://ai-gateway:8000
            - name: SMTP_HOST
              value: 10.10.40.10
            - name: SMTP_PORT
              value: '1025'
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    type: Recreate
