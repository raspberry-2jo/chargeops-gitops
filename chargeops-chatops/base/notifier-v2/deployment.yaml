apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-v2
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier-v2
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: notifier-v2
          image: chanjookim/chargeops-v2-notifier:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: chargeops-app-secrets
          env:
            - name: CSMS_URL
              value: http://csms-v2:8000
            - name: AI_URL
              value: http://ai-gateway:8000
            - name: SMTP_HOST
              value: 10.10.40.10
            - name: SMTP_PORT
              value: '1025'
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    type: Recreate
