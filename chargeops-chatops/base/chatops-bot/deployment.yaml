apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-bot
spec:
  replicas: 0
  selector:
    matchLabels:
      app: chatops-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-bot
        app: chatops-bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: chatops-bot
        image: registry.chargeops.lab:5000/chargeops/chargeops-chatops-bot:dev
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: chargeops-secrets
        env:
        - name: CSMS_URL
          value: http://csms:8000
        - name: AI_URL
          value: http://ai-gateway:8000
        - name: JENKINS_URL
          value: http://10.10.40.10:8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  strategy:
    type: Recreate
