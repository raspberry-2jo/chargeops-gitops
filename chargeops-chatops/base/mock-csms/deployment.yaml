apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-csms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mock-csms
  template:
    metadata:
      labels:
        app: mock-csms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: csms
          image: chanjookim/chargeops-mock-csms:initial
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - app.csms:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatops-config
            - secretRef:
                name: csms-credentials
          volumeMounts:
            - name: demo-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: demo-data
          emptyDir: {}
